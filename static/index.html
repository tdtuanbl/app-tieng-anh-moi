<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tiếng Anh Cùng Cô & Bé Đậu</title>
  
  <!-- Cấu hình PWA & Safari iOS/iPadOS -->
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#F59E0B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Học Cùng Cô">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥑</text></svg>">

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Chống chọn text ngẫu nhiên, cho phép cuộn tự nhiên trên mobile */
    html, body {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    /* Hiệu ứng sóng âm thanh khi đang phát TTS */
    @keyframes audioPulseWave {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.85; }
    }
    .audio-playing-pulse {
      animation: audioPulseWave 1s ease-in-out infinite;
    }
  </style>
</head>
<body class="min-h-full w-full bg-amber-50/40 text-slate-800 flex flex-col font-sans">

  <!-- LỚP PHỦ CHÀO MỪNG / MỞ KHÓA ÂM THANH SAFARI IPADOS -->
  <div id="start-overlay" class="fixed inset-0 z-50 bg-gradient-to-br from-amber-400 via-amber-300 to-yellow-200 flex flex-col items-center justify-center p-6 select-none" role="dialog" aria-modal="true" aria-labelledby="start-title">
    <div class="bg-white/95 backdrop-blur-md rounded-[3rem] p-8 md:p-10 max-w-lg w-full shadow-2xl border-4 border-amber-200 flex flex-col items-center text-center">
      <div class="text-7xl md:text-8xl mb-4" aria-hidden="true">🥑🌟</div>
      <h1 id="start-title" class="text-3xl md:text-4xl font-black text-slate-800 mb-2">Tiếng Anh Cùng Cô</h1>
      <p class="text-lg font-bold text-slate-600 mb-8">Bé Đậu sẵn sàng vui học cùng cô chưa nào?</p>
      <button onclick="unlockAudioAndStart()" aria-label="Bắt đầu buổi học cùng cô" class="w-full py-5 px-6 rounded-3xl bg-amber-400 hover:bg-amber-500 active:scale-95 text-slate-900 font-black text-xl md:text-2xl shadow-xl shadow-amber-300/60 border-2 border-white flex items-center justify-center gap-3 transition-all cursor-pointer">
        <span>Chạm để bắt đầu cùng cô! 🚀</span>
      </button>
    </div>
  </div>

  <!-- TOP BAR RESPONSIVE CHO CẢ ĐIỆN THOẠI & IPAD -->
  <header class="min-h-[4.5rem] py-2 px-3 sm:px-6 bg-white/90 backdrop-blur-md border-b border-amber-100 flex flex-wrap items-center justify-between gap-2 shadow-sm z-30 shrink-0">
    <!-- Góc trái: Avatar + Lời chào + Đếm Sao -->
    <div class="flex items-center gap-2.5 sm:gap-4">
      <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-2xl bg-gradient-to-tr from-amber-400 to-yellow-300 flex items-center justify-center text-xl sm:text-2xl shadow-sm border-2 border-white shrink-0" aria-hidden="true">
        🌱
      </div>
      <div class="flex flex-col">
        <span class="font-extrabold text-base sm:text-lg text-slate-800 tracking-tight flex items-center gap-1">
          Chào Bé Đậu! 🌟
        </span>
        <div class="flex items-center gap-2">
          <div class="flex items-center gap-1 bg-yellow-100/90 text-yellow-800 font-black text-xs sm:text-sm px-2.5 py-0.5 rounded-full w-fit shadow-inner" aria-label="Tổng số sao của bé">
            <span aria-hidden="true">⭐</span>
            <span id="star-count">0</span>
            <span class="text-[11px] sm:text-xs font-semibold text-yellow-700">sao</span>
          </div>
          <button id="btn-header-badge" onclick="HomeScreen.openBadgeModal()" aria-label="Mở bộ sưu tập huy hiệu của bé Đậu" class="px-2.5 py-0.5 rounded-full bg-gradient-to-r from-amber-400 to-yellow-400 hover:from-amber-500 hover:to-yellow-500 text-slate-900 font-black text-xs shadow-sm border border-white flex items-center gap-1 active:scale-95 transition-all cursor-pointer">
            <span>🏆</span>
            <span id="header-badge-count">Huy hiệu (0/8)</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Góc phải: Nút tốc độ đọc + Nút gạt chế độ giọng nói + Nút về Trang chủ -->
    <div class="flex items-center gap-1.5 sm:gap-3 flex-wrap">
      <button id="btn-speed" onclick="AppState.togglePlaybackRate()" aria-label="Thay đổi tốc độ đọc của cô" class="px-2.5 sm:px-3 py-1.5 rounded-2xl bg-amber-100 hover:bg-amber-200 text-amber-900 font-bold text-xs sm:text-sm transition-all shadow-sm flex items-center gap-1 active:scale-95">
        <span class="text-sm sm:text-base" aria-hidden="true">⚡</span>
        <span id="speed-label">1.2x</span>
      </button>

      <button id="btn-voice-mode" onclick="AppState.toggleVoiceMode()" aria-label="Chuyển chế độ giọng nói song ngữ hoặc tiếng Anh" class="px-2.5 sm:px-3.5 py-1.5 rounded-2xl bg-amber-100 hover:bg-amber-200 text-amber-900 font-bold text-xs sm:text-sm transition-all shadow-sm flex items-center gap-1.5 active:scale-95">
        <span class="text-base sm:text-lg" aria-hidden="true">🇻🇳+🇬🇧</span>
        <span class="hidden xs:inline">Song ngữ</span>
      </button>

      <button id="btn-home" onclick="AppState.showScreen('screen-home')" aria-label="Quay về trang chủ" class="px-3 sm:px-4 py-1.5 sm:py-2 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs sm:text-sm transition-all shadow-sm flex items-center gap-1.5 active:scale-95">
        <span class="text-base sm:text-lg" aria-hidden="true">🏠</span>
        <span>Trang chủ</span>
      </button>
    </div>
  </header>

  <!-- VÙNG NỘI DUNG 4 MÀN HÌNH CHÍNH (TỰ ĐỘNG CUỘN TRÊN ĐIỆN THOẠI, KHÓA CUỘN RIÊNG CHO GAME ĐUA XE) -->
  <main class="flex-1 w-full relative p-2 sm:p-6 overflow-y-auto">
    
    <!-- 1. Màn hình Trang Chủ -->
    <section id="screen-home" class="w-full min-h-full flex flex-col items-center justify-between">
      <!-- Nội dung các chủ đề và chế độ học sẽ được nạp tại đây -->
    </section>

    <!-- 2. Màn hình Học Flashcard -->
    <section id="screen-learn" class="hidden w-full min-h-full flex flex-col">
      <!-- Thẻ từ vựng tương tác lớn -->
    </section>

    <!-- 3. Màn hình Thử Thách Trắc Nghiệm -->
    <section id="screen-quiz" class="hidden w-full min-h-full flex flex-col">
      <!-- Đố vui nhận diện hình ảnh & từ vựng -->
    </section>

    <!-- 4. Màn hình Đua Xe Từ Vựng (Khóa cuộn trong game đua xe) -->
    <section id="screen-racer" class="hidden w-full h-[calc(100vh-5.5rem)] min-h-[520px] flex flex-col overflow-hidden touch-none">
      <!-- Trò chơi đua xe tương tác hứng sao -->
    </section>

  </main>

  <!-- Script Khởi tạo -->
  <script src="/static/js/state.js?v=25"></script>
  <script src="/static/js/home.js?v=25"></script>
  <script src="/static/js/learn.js?v=25"></script>
  <script src="/static/js/quiz.js?v=25"></script>
  <script src="/static/js/racer.js?v=25"></script>
  <script>
    // Mở khóa AudioContext và quyền phát âm thanh trên Safari iPadOS
    function unlockAudioAndStart() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) {
        const ctx = new AudioCtx();
        ctx.resume();
      }
      if (window.AppState && AppState.audioPlayer) {
        AppState.audioPlayer.play().catch(() => {});
      } else {
        const dummy = new Audio();
        dummy.play().catch(() => {});
      }

      const overlay = document.getElementById("start-overlay");
      if (overlay) {
        overlay.classList.add("hidden");
      }

      if (window.AppState) {
        AppState.speakText("Xin chào Bé Đậu! Cô chúc Bé Đậu học thật vui nhé!", "vi");
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      AppState.init();
    });
  </script>
</body>
</html>
